# vet and test on every push to main and every pull request.
labels:
  backend: docker

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  - name: test
    image: docker.io/library/golang:1.26-alpine@sha256:8ac98ca534ac3f51e1f420a1dd2c15e74c75cfa0f23f3ad27eb5d7236c349a0c
    commands:
      - apk add --no-cache git >/dev/null
      # gitleaks, pinned: the scanner's tests skip without it.
      - wget -qO /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      - echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
      - tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - go vet ./...
      - go test ./...
